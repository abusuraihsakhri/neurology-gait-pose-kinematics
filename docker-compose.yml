version: '3.8'

services:
  neurology-gait-pose-kinematics:
    build: .
    container_name: neurology-gait-pose-kinematics
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=neurology-gait-pose-kinematics-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
