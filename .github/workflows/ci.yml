name: Tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,dev]"
          python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents gait_mind_ai cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scripts
        run: |
          node --check web/ui.mjs
          node --check web/evaluator.mjs
      - name: Test browser evaluation rules
        run: node --test web/evaluator.test.mjs
